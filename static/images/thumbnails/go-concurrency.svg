<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
<title id="title">Go concurrency</title><desc id="desc">Mutex protects a shared critical section; atomic updates a single value.</desc>
<style>:root{--paper:#f6f8f7;--ink:#1f2421;--muted:#5f6762;--line:#c9cfcb;--accent:#176b51}text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;fill:var(--ink)}.label{font-size:25px;fill:var(--muted)}.node{fill:var(--paper);stroke:var(--line);stroke-width:2}.path{fill:none;stroke:var(--accent);stroke-width:4}</style>
<rect width="1200" height="750" fill="var(--paper)"/><text x="80" y="110" class="label">GO / CONCURRENCY</text>
<text x="80" y="245" font-size="68">Mutex &amp; Atomic</text><rect x="80" y="335" width="450" height="225" class="node"/><rect x="670" y="335" width="450" height="225" class="node"/><text x="115" y="400" font-size="36">Mutex</text><text x="115" y="465" class="label">Lock → Update → Unlock</text><text x="705" y="400" font-size="36">Atomic</text><text x="705" y="465" class="label">Add / Load / Store</text><path d="M530 447H670" class="path"/>
<path d="M80 660H1120" stroke="var(--line)" stroke-width="2"/><text x="80" y="706" class="label">JAEYOUNG LEE / ENGINEERING NOTES</text></svg>